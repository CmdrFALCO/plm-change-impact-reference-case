<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#60717E"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="70" y="64" font-family="Lato,Arial,sans-serif" font-size="34" font-weight="700" fill="#20364A" text-anchor="start"><tspan x="70" dy="0">Current State, Baseline and Proposed-State Separation</tspan></text><text x="70" y="103" font-family="Lato,Arial,sans-serif" font-size="18" font-weight="400" fill="#60717E" text-anchor="start"><tspan x="70" dy="0">Historical evaluation uses an immutable captured basis plus a versioned non-authoritative overlay.</tspan></text><line x1="70" y1="128" x2="1530" y2="128" stroke="#C9D3DA" stroke-width="2"/><rect x="60" y="205" width="250" height="500" rx="12" fill="#EAF1F5" stroke="#C9D8E1" stroke-width="2"/><text x="185" y="250" font-family="Lato,Arial,sans-serif" font-size="18" font-weight="700" fill="#3B6F8F" text-anchor="middle"><tspan x="185" dy="0">LIVE / SOURCE</tspan></text><text x="185" y="350" font-family="Lato,Arial,sans-serif" font-size="28" font-weight="700" fill="#20364A" text-anchor="middle"><tspan x="185" dy="0">Current state</tspan></text><text x="185" y="405" font-family="Lato,Arial,sans-serif" font-size="17" font-weight="400" fill="#60717E" text-anchor="middle"><tspan x="185" dy="0">Synthetic integration</tspan><tspan x="185" dy="20.74">projection</tspan></text><text x="185" y="585" font-family="Lato,Arial,sans-serif" font-size="16" font-weight="400" fill="#20364A" text-anchor="middle"><tspan x="185" dy="0">Selected relevant state</tspan><tspan x="185" dy="19.52">is captured - not the</tspan><tspan x="185" dy="19.52">complete enterprise world.</tspan></text><line x1="315" y1="385" x2="390" y2="385" stroke="#1F7A7A" stroke-width="4" marker-end="url(#arrow)"/><text x="350" y="365" font-family="Lato,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F7A7A" text-anchor="middle"><tspan x="350" dy="0">capture</tspan></text><rect x="400" y="200" width="420" height="220" rx="12" fill="#E5F1F0" stroke="#BDD8D5" stroke-width="2"/><text x="610" y="245" font-family="Lato,Arial,sans-serif" font-size="16" font-weight="700" fill="#1F7A7A" text-anchor="middle"><tspan x="610" dy="0">CAPTURED CURRENT-STATE BASIS</tspan></text><text x="610" y="320" font-family="Lato,Arial,sans-serif" font-size="27" font-weight="700" fill="#20364A" text-anchor="middle"><tspan x="610" dy="0">Assessment Baseline</tspan></text><rect x="470" y="350" width="280" height="42" rx="8" fill="#FFFFFF" stroke="#C7DCDA" stroke-width="1.3"/><text x="610" y="377" font-family="Lato,Arial,sans-serif" font-size="14" font-weight="700" fill="#20364A" text-anchor="middle"><tspan x="610" dy="0">Baseline Members = immutable snapshots</tspan></text><rect x="400" y="465" width="420" height="245" rx="12" fill="#F5F7F9" stroke="#CBD5DB" stroke-width="2"/><text x="610" y="510" font-family="Lato,Arial,sans-serif" font-size="16" font-weight="700" fill="#2F4A5E" text-anchor="middle"><tspan x="610" dy="0">VERSIONED PROPOSED-STATE BASIS</tspan></text><text x="610" y="565" font-family="Lato,Arial,sans-serif" font-size="22" font-weight="700" fill="#20364A" text-anchor="middle"><tspan x="610" dy="0">Change Item Revision</tspan></text><line x1="610" y1="580" x2="610" y2="615" stroke="#60717E" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="642" font-family="Lato,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364A" text-anchor="middle"><tspan x="610" dy="0">Overlay Revision</tspan></text><text x="610" y="670" font-family="Lato,Arial,sans-serif" font-size="13" font-weight="400" fill="#60717E" text-anchor="middle"><tspan x="610" dy="0">exact revision membership</tspan></text><rect x="495" y="680" width="230" height="28" rx="7" fill="#FFFFFF" stroke="#C9D5DB" stroke-width="1.2"/><text x="610" y="699" font-family="Lato,Arial,sans-serif" font-size="11" font-weight="700" fill="#3B6F8F" text-anchor="middle"><tspan x="610" dy="0">Overlay-local Object · hypothetical state</tspan></text><text x="930" y="455" font-family="Lato,Arial,sans-serif" font-size="42" font-weight="700" fill="#1F7A7A" text-anchor="middle"><tspan x="930" dy="0">+</tspan></text><line x1="825" y1="315" x2="1070" y2="385" stroke="#1F7A7A" stroke-width="4" marker-end="url(#arrow)"/><text x="930" y="300" font-family="Lato,Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A7A" text-anchor="middle"><tspan x="930" dy="0">current-state basis</tspan></text><line x1="825" y1="585" x2="1070" y2="500" stroke="#1F7A7A" stroke-width="4" marker-end="url(#arrow)"/><text x="930" y="610" font-family="Lato,Arial,sans-serif" font-size="14" font-weight="700" fill="#1F7A7A" text-anchor="middle"><tspan x="930" dy="0">proposed-state basis</tspan></text><rect x="1080" y="270" width="450" height="355" rx="12" fill="#E8F1EB" stroke="#C6DCCD" stroke-width="2"/><text x="1305" y="315" font-family="Lato,Arial,sans-serif" font-size="18" font-weight="700" fill="#3F7D5A" text-anchor="middle"><tspan x="1305" dy="0">EVALUATION</tspan></text><text x="1305" y="420" font-family="Lato,Arial,sans-serif" font-size="31" font-weight="700" fill="#20364A" text-anchor="middle"><tspan x="1305" dy="0">Impact-analysis</tspan><tspan x="1305" dy="37.82">Execution</tspan></text><text x="1305" y="545" font-family="Lato,Arial,sans-serif" font-size="17" font-weight="400" fill="#60717E" text-anchor="middle"><tspan x="1305" dy="0">one Assessment Baseline</tspan><tspan x="1305" dy="20.74">+ one Overlay Revision</tspan><tspan x="1305" dy="20.74">+ recorded rule-set version</tspan></text><rect x="170" y="770" width="1260" height="65" rx="8" fill="#20364A" stroke="#20364A" stroke-width="0"/><text x="800" y="810" font-family="Lato,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="800" dy="0">Later source changes cannot redefine history: reconstruction uses stored snapshots and locked records.</tspan></text></svg>